apiVersion: v1
kind: Pod
metadata:
  name: ${POD_NAME}
  namespace: ${NAMESPACE}
spec:
  restartPolicy: Never
  # hostNetwork toggled by the two probes: a normal pod (false) sits one hop beyond the
  # host and must NOT reach IMDS (hop limit 1); a hostNetwork pod (true) shares the host
  # netns (hop 0) and MUST reach IMDS — the positive control that pins the block to the
  # hop limit rather than a blanket route/firewall issue.
  hostNetwork: ${HOST_NETWORK}
  containers:
    - name: probe
      image: ${CLIENT_IMAGE}
      command: ["/bin/sh", "-c"]
      args: ["sleep 3600"]
