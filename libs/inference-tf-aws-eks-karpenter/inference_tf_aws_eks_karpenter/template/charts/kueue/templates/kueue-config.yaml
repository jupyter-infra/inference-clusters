# NOTE: the workload namespace ({{ .Values.workloadNamespace }}) is created by the ENGINE
# (kubernetes_namespace_v1.workload, platform_workloads.tf), NOT this chart — it is shared,
# ungated infra that must outlive Kueue. The LocalQueue below just references it.
#
# NO Topology CR / Topology-Aware Scheduling. TAS discovers admissible topology domains
# from nodes that ALREADY exist at admission time — which deadlocks a scale-from-zero
# GPU pool (no g-nodes yet → no zone domains → never admitted → Karpenter never
# provisions → still no nodes). AZ co-location for multi-node NCCL/EFA is instead
# enforced at provision time by the LWS `exclusive-topology` annotation (leader schedules
# first, workers inherit its zone as a nodeSelector) — the Karpenter-native pattern.
apiVersion: kueue.x-k8s.io/v1beta2
kind: ResourceFlavor
metadata:
  name: gpu-multinode
spec:
  # Target the g-tier (always-on, cheaper) GPU pool. The p-tier (nvidia-p) carries an
  # extra inference/gpu-tier=high taint requiring explicit opt-in, so admitted pods
  # would stay Pending there without that toleration; g-tier only taints nvidia.com/gpu.
  nodeLabels:
    inference/accelerator: nvidia-g
  tolerations:
    - key: nvidia.com/gpu
      operator: Exists
      effect: NoSchedule
---
apiVersion: kueue.x-k8s.io/v1beta2
kind: ResourceFlavor
metadata:
  name: gpu-p-multinode
spec:
  # The high-end p-tier (H100-class). NOT e2e-tested — P capacity is scarce/ICE-prone, so
  # g-tier is the tested path — but the flavor MUST exist so Kueue can reach the P pool at
  # all. A P workload opts in with nodeSelector inference/accelerator=nvidia-p, which makes
  # the g flavor incompatible so admission falls to this one. The p pool carries a SECOND
  # taint (inference/gpu-tier=high) on top of nvidia.com/gpu — this flavor tolerates both,
  # so admitted P pods can actually land. It is only wired into the ClusterQueue when
  # enableGpuPNodes (below); without the p node pool a P workload would admit then hang Pending.
  nodeLabels:
    inference/accelerator: nvidia-p
  tolerations:
    - key: nvidia.com/gpu
      operator: Exists
      effect: NoSchedule
    - key: inference/gpu-tier
      operator: Equal
      value: "high"
      effect: NoSchedule
---
apiVersion: kueue.x-k8s.io/v1beta2
kind: ResourceFlavor
metadata:
  name: cpu-default
spec:
  # Match-anything CPU flavor: no nodeLabels (any node).
  {}
---
apiVersion: kueue.x-k8s.io/v1beta2
kind: ClusterQueue
metadata:
  name: {{ .Values.clusterQueueName }}
spec:
  namespaceSelector: {}
  cohortName: {{ .Values.cohortName }}
  resourceGroups:
    # Flavors are tried in order: g-tier first (cost-safe default), then the p-tier (only
    # present when the p node pool is enabled). A pod reaches p by nodeSelecting
    # inference/accelerator=nvidia-p, which makes the g flavor incompatible.
    - coveredResources: ["nvidia.com/gpu"]
      flavors:
        - name: gpu-multinode
          resources:
            - name: nvidia.com/gpu
              nominalQuota: {{ .Values.gpuQuota | quote }}
              {{- if .Values.gpuLendingLimit }}
              lendingLimit: {{ .Values.gpuLendingLimit | quote }}
              {{- end }}
        {{- if .Values.enableGpuPNodes }}
        - name: gpu-p-multinode
          resources:
            - name: nvidia.com/gpu
              nominalQuota: {{ .Values.gpuQuota | quote }}
              {{- if .Values.gpuLendingLimit }}
              lendingLimit: {{ .Values.gpuLendingLimit | quote }}
              {{- end }}
        {{- end }}
    - coveredResources: ["cpu", "memory"]
      flavors:
        - name: cpu-default
          resources:
            - name: cpu
              nominalQuota: {{ .Values.cpuQuota | quote }}
            - name: memory
              nominalQuota: {{ .Values.memoryQuota | quote }}
  preemption:
    withinClusterQueue: LowerPriority
    reclaimWithinCohort: LowerPriority
---
apiVersion: kueue.x-k8s.io/v1beta2
kind: LocalQueue
metadata:
  name: inference
  namespace: {{ .Values.workloadNamespace }}
spec:
  clusterQueue: {{ .Values.clusterQueueName }}
