apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  labels:
    app: {{ .Release.Name }}
spec:
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels:
      app: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      # GPU placement: land on the Karpenter gpu-g NodePool. The pod pends until
      # Karpenter provisions a node — that IS segment 3 of the autoscaling chain.
      nodeSelector:
        inference/accelerator: nvidia-g
      tolerations:
        - key: nvidia.com/gpu
          operator: Exists
          effect: NoSchedule
      # Weights load from the read-only S3-mount PVC (charts/storage). No image
      # baking, no init download — vLLM reads the model dir straight off the mount.
      volumes:
        - name: model-store
          persistentVolumeClaim:
            claimName: {{ .Values.modelStorePvc }}
        # vLLM needs a writable /dev/shm for tensor-parallel/NCCL; default is tiny.
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 4Gi
      containers:
        - name: server
          image: {{ include "chart.image" .Values.images.server }}
          args:
            - "--model=/models/{{ .Values.weightsSubPath }}"
            - "--served-model-name={{ .Values.servedModelName }}"
            - "--gpu-memory-utilization={{ .Values.gpuMemoryUtilization }}"
            - "--max-model-len={{ .Values.maxModelLen }}"
            - "--port={{ .Values.port }}"
          ports:
            - name: http
              containerPort: {{ .Values.port }}
          resources:
            limits:
              nvidia.com/gpu: 1
          volumeMounts:
            - name: model-store
              mountPath: /models
              readOnly: true
            - name: shm
              mountPath: /dev/shm
          # Weight load on a fresh node takes minutes (mount + read ~15GB + CUDA graph
          # capture); a generous startupProbe keeps liveness from killing it mid-load.
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 15
            failureThreshold: 60          # up to 15 min to become ready
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
