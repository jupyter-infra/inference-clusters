[project]
name = "inference-tf-aws-eks-karpenter"
version = "0.1.0rc1"
description = "Terraform template to provision a base AWS EKS cluster with Karpenter for inference workloads."
readme = "README.md"
authors = [
    { name = "Jonathan Guinegagne", email = "jggg@amazon.com" },
]
requires-python = ">=3.12"
dependencies = [
    "boto3",
    "boto3-stubs",
    "huggingface-hub",
    "mypy-boto3-eks",
    "mypy-boto3-s3",
    "mypy-boto3-sts",
    "kubernetes>=31.0.0",
]

[project.license]
file = "LICENSE"

[project.entry-points."jupyter_deploy.terraform_templates"]
aws_eks_karpenter = "inference_tf_aws_eks_karpenter.template:TEMPLATE_PATH"

[project.urls]
Homepage = "https://github.com/jupyter-infra/inference-clusters"
github = "https://github.com/jupyter-infra/inference-clusters/tree/main/libs/inference-tf-aws-eks-karpenter"

[build-system]
requires = [
    "hatchling",
]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
    "inference_tf_aws_eks_karpenter",
]

[tool.mypy]
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
check_untyped_defs = true
mypy_path = [
    ".",
]
packages = [
    "inference_tf_aws_eks_karpenter",
]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
preview = true
select = [
    "E",
    "F",
    "UP",
    "B",
    "SIM",
    "I",
    "PLC0415",
]
ignore = [
    "UP042",
    "UP046",
    "UP047",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
docstring-code-format = true
docstring-code-line-length = 40

[tool.pytest.ini_options]
testpaths = [
    "tests/unit",
]
markers = [
    "e2e: End-to-end tests using playwright (deselect with '-m \"not e2e\"')",
    "benchmark: Opt-in performance benchmarks (not a pass/fail gate; run via 'just bench-*')",
    "gpu: Schedules a Karpenter GPU node; collected last so all GPU tests share one warm node",
]

[dependency-groups]
dev = [
    "jupyter-deploy[aws,k8s]",
    "pytest-jupyter-deploy[ui]",
    "mypy>=1.15.0",
    "pytest>=8.3.5",
    "python-hcl2>=7.2.1",
    "pyyaml>=6.0.2",
    "ruff>=0.11.8",
    "types-pyyaml>=6.0.12.20250516",
    "yamllint>=1.35.0",
]
