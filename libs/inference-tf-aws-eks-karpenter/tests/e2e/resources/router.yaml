# Scale-from-zero activator/router for the KEDA online-serving E2E.
#
# An ALWAYS-ON proxy (1 replica) whose in-flight metric KEDA scales the vLLM serving pod
# on — see router.py for the why (breaks the "can't scale 0->1 on a metric the pod emits
# itself" chicken-and-egg). The router.py script is delivered via a ConfigMap the test
# builds from the file (kubectl create configmap --from-file), so the script stays the
# single source of truth (not embedded here).
#
# Placement: the router is pinned to the gpu-g pool (tolerates the GPU taint) but requests
# ZERO GPU — it is a CPU proxy. This keeps a g node WARM from setup, so when KEDA scales
# vLLM 0->1 the scheduler bin-packs vLLM onto that already-running node: the scale event
# is pod-start only (weights load), not a node cold-start. (The node-provisioning half of
# the KEDA->Karpenter chain is already proven by test_vllm_serving / test_kro_graph_serving;
# this test isolates the router-metric -> KEDA -> pod 0->1->0 half.)
#
# ${backend_url}, ${router_image}, and ${namespace} are substituted at apply time (h.apply_resource).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: keda-router
  namespace: ${namespace}
  labels:
    app: keda-router
spec:
  replicas: 1
  selector:
    matchLabels:
      app: keda-router
  template:
    metadata:
      labels:
        app: keda-router
    spec:
      # Same gpu-g pool as the serving pod so a node is warm before the scale event, but
      # request no GPU — the router is a CPU proxy that just needs to co-locate.
      nodeSelector:
        inference/accelerator: nvidia-g
      tolerations:
        - key: nvidia.com/gpu
          operator: Exists
          effect: NoSchedule
      volumes:
        - name: script
          configMap:
            name: keda-router-script
      containers:
        - name: router
          image: "${router_image}"
          command: ["python", "/app/router.py"]
          env:
            - name: BACKEND_URL
              value: "${backend_url}"
            - name: LISTEN_PORT
              value: "8080"
          ports:
            - name: http
              containerPort: 8080
          volumeMounts:
            - name: script
              mountPath: /app
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: keda-router
  namespace: ${namespace}
  labels:
    app: keda-router
spec:
  selector:
    app: keda-router
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: keda-router
  namespace: ${namespace}
  labels:
    # The kube-prometheus-stack Prometheus selects ServiceMonitors on this release label
    # (serviceMonitorSelector = release: kube-prometheus-stack) — without it the router's
    # metric is never scraped and KEDA's Prometheus trigger sees no series.
    release: kube-prometheus-stack
spec:
  selector:
    matchLabels:
      app: keda-router
  endpoints:
    - port: http
      path: /metrics
      interval: 10s
