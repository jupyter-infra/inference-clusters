# Benchmark onboard chart values — images: only, no weights.

# Any large multi-layer image works here — the benchmark only measures pull time
# (optimized vs unoptimized), so the specific contents don't matter. We use a GPU/ML
# image the onboarder digest-vendors to <ecr>/<cluster>/workload/pytorch-training@<digest>.
# Sourced from public.ecr.aws so the onboarder (which has public egress) can pull it
# without credentials.
images:
  bench:
    registry: public.ecr.aws
    repository: deep-learning-containers/pytorch-training
    tag: 2.5.1-gpu-py311-cu124-ubuntu22.04-ec2
