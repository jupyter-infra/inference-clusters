{{- if .Values.fsx.enabled }}
apiVersion: kro.run/v1alpha1
kind: ResourceGraphDefinition
metadata:
  name: fsx-hydrate
spec:
  schema:
    apiVersion: v1alpha1
    kind: FsxHydrate
    spec:
      prefix: string | required=true
    status:
      succeeded: ${job.status.succeeded}
      failed: ${job.status.failed}
  resources:
    - id: job
      template:
        apiVersion: batch/v1
        kind: Job
        metadata:
          name: fsx-hydrate-${schema.metadata.name}
          labels:
            app.kubernetes.io/name: fsx-hydrate
            app.kubernetes.io/component: hydration
            app.kubernetes.io/managed-by: kro
        spec:
          backoffLimit: 3
          activeDeadlineSeconds: 7200
          ttlSecondsAfterFinished: 86400
          template:
            metadata:
              labels:
                app.kubernetes.io/name: fsx-hydrate
                app.kubernetes.io/component: hydration
            spec:
              restartPolicy: OnFailure
              affinity:
                nodeAffinity:
                  requiredDuringSchedulingIgnoredDuringExecution:
                    nodeSelectorTerms:
                      - matchExpressions:
                          - key: topology.kubernetes.io/zone
                            operator: In
                            values:
                              - {{ .Values.fsx.availabilityZone | quote }}
              tolerations:
                - key: inference/role
                  operator: Equal
                  value: system
                  effect: NoSchedule
              volumes:
                - name: models
                  persistentVolumeClaim:
                    claimName: {{ .Values.fsx.claimName | quote }}
              containers:
                - name: hydrator
                  image: {{ .Values.fsx.hydrator.image | quote }}
                  env:
                    - name: PREFIX
                      value: ${schema.spec.prefix}
                  command: ["sh", "-c"]
                  args:
                    - |
                      set -euo pipefail

                      case "$PREFIX" in *..*|"") echo "[hydrate] FAIL: invalid PREFIX"; exit 1 ;; esac

                      awk '$2 == "/mnt/models" && $3 == "lustre" { found=1 } END { exit !found }' /proc/mounts \
                        || { echo "[hydrate] FAIL: /mnt/models is not lustre"; cat /proc/mounts; exit 1; }

                      SLUG=$(printf %s "$PREFIX" | tr '/' '-')

                      if [ ! -d "/mnt/models/$PREFIX" ]; then
                        echo "[hydrate] awaiting DRA import of /mnt/models/$PREFIX"
                        DEADLINE=$(( $(date +%s) + 300 ))
                        until [ -d "/mnt/models/$PREFIX" ]; do
                          [ "$(date +%s)" -ge "$DEADLINE" ] && { echo "[hydrate] FAIL: /mnt/models/$PREFIX never appeared"; exit 1; }
                          sleep 10
                        done
                      fi

                      # Reading a released file triggers Lustre's kernel-side
                      # implicit HSM restore and blocks until every byte is on
                      # OSTs; `cat > /dev/null` is that trigger without needing
                      # a Lustre-client binary (`lfs hsm_restore`) in the pod.
                      echo "[hydrate] pre-warm fan-out (P=32)"
                      find "/mnt/models/$PREFIX" -type f -print0 \
                        | xargs -0 -r -P 32 -n 1 sh -c 'cat "$0" > /dev/null'

                      touch "/mnt/models/.hydrated-$SLUG"
                      echo "[hydrate] OK — .hydrated-$SLUG"
                  resources:
                    requests:
                      cpu: "500m"
                      memory: 512Mi
                    limits:
                      memory: 2Gi
                  volumeMounts:
                    - name: models
                      mountPath: /mnt/models
{{- end }}
