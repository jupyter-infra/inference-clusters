{{- /*
EC2NodeClasses (karpenter.k8s.aws/v1).
  - cpu: AL2023 standard, selected by the al2023@latest alias.
  - gpu: AL2023 NVIDIA — NOT selectable by alias (Karpenter v1 only accepts alias
         families al2/al2023/bottlerocket/windows*; there is NO al2023-nvidia
         alias). The GPU AMI must be selected another way; we resolve its ID from
         the EKS-optimized SSM parameter and pass it in as gpuAmiId.
Both discover subnets + SG via karpenter.sh/discovery, attach the shared node
role, and use a large gp3 root. Karpenter generates the join NodeConfig userData.
*/ -}}
{{- /*
Partial NodeConfig enabling the SOCI snapshotter (parallel pull/unpack) on the GPU classes,
merged with Karpenter's cluster-join config. On AL2023 nodeadm's FastImagePull feature gate
turns on SOCI parallel mode, concurrently downloading+unpacking multi-GB GPU/ML image layers.
*/ -}}
{{- define "karpenter.gpuParallelPullUserData" -}}
{{- if .Values.gpuParallelPull.enabled }}
  userData: |
    apiVersion: node.eks.aws/v1alpha1
    kind: NodeConfig
    spec:
      featureGates:
        FastImagePull: true
{{- end }}
{{- end -}}
{{- /* Extra root-volume EBS throughput/IOPS for SOCI parallel pull (buffers layers to disk). */ -}}
{{- define "karpenter.gpuEbsTuning" -}}
{{- if .Values.gpuParallelPull.enabled }}
        throughput: {{ .Values.gpuParallelPull.ebsThroughputMiBps | int64 }}
        iops: {{ .Values.gpuParallelPull.ebsIops | int64 }}
{{- end }}
{{- end -}}
apiVersion: karpenter.k8s.aws/v1
kind: EC2NodeClass
metadata:
  name: cpu
spec:
  amiSelectorTerms:
    - alias: al2023@latest
  # instanceProfile (pre-created in Terraform), NOT role: on the endpoints-only VPC
  # Karpenter can't reach IAM to manage a profile itself. See iam.tf.
  instanceProfile: {{ .Values.nodeInstanceProfile | quote }}
  subnetSelectorTerms:
    - tags:
        karpenter.sh/discovery: {{ .Values.discoveryTag | quote }}
  securityGroupSelectorTerms:
    - tags:
        karpenter.sh/discovery: {{ .Values.discoveryTag | quote }}
  blockDeviceMappings:
    - deviceName: {{ .Values.blockDevice.deviceName }}
      ebs:
        volumeSize: {{ .Values.blockDevice.volumeSizeGi }}Gi
        volumeType: {{ .Values.blockDevice.volumeType }}
        encrypted: true
  # Hop limit 1: a pod is one hop beyond the host, so an IMDS response (TTL=1) expires
  # before reaching it — pods cannot read IMDS or assume the node role via SSRF.
  # Workloads get AWS creds from EKS Pod Identity, not IMDS. See test_imds_blocked.
  metadataOptions:
    httpEndpoint: enabled
    httpTokens: required
    httpPutResponseHopLimit: 1
  tags:
    karpenter.sh/discovery: {{ .Values.discoveryTag | quote }}
{{- if .Values.gpuP.enabled }}
---
apiVersion: karpenter.k8s.aws/v1
kind: EC2NodeClass
metadata:
  name: gpu-p
spec:
  # Same EKS-optimized AL2023 NVIDIA AMI + device plugin as the g pool (p4d/p5/p5en
  # are all x86_64 NVIDIA — verified live), so no separate bootstrap machinery.
  amiFamily: AL2023
  amiSelectorTerms:
    - id: {{ .Values.gpuAmiId | quote }}
  instanceProfile: {{ .Values.nodeInstanceProfile | quote }}
  subnetSelectorTerms:
    - tags:
        karpenter.sh/discovery: {{ .Values.discoveryTag | quote }}
  securityGroupSelectorTerms:
    - tags:
        karpenter.sh/discovery: {{ .Values.discoveryTag | quote }}
  blockDeviceMappings:
    - deviceName: {{ .Values.blockDevice.deviceName }}
      ebs:
        volumeSize: {{ .Values.blockDevice.volumeSizeGi }}Gi
        volumeType: {{ .Values.blockDevice.volumeType }}
        encrypted: true
{{- include "karpenter.gpuEbsTuning" . }}
  # Hop limit 1 — pods cannot reach IMDS / the node role via SSRF. See the cpu class.
  metadataOptions:
    httpEndpoint: enabled
    httpTokens: required
    httpPutResponseHopLimit: 1
{{- if .Values.gpuP.capacityReservationId }}
  # ODCR seam: pin the P pool to a Capacity Reservation. Karpenter launches
  # into the reservation instead of plain on-demand — the way orgs secure scarce P
  # capacity. Empty = plain on-demand.
  capacityReservationSelectorTerms:
    - id: {{ .Values.gpuP.capacityReservationId | quote }}
{{- end }}
{{ include "karpenter.gpuParallelPullUserData" . }}
  tags:
    karpenter.sh/discovery: {{ .Values.discoveryTag | quote }}
{{- end }}
---
apiVersion: karpenter.k8s.aws/v1
kind: EC2NodeClass
metadata:
  name: gpu
spec:
  # GPU AMI selected by explicit ID (resolved from the EKS-optimized NVIDIA SSM
  # parameter in Terraform), NOT an alias. amiFamily is required when using a
  # non-alias selector term so Karpenter knows how to bootstrap.
  amiFamily: AL2023
  amiSelectorTerms:
    - id: {{ .Values.gpuAmiId | quote }}
  # instanceProfile (pre-created in Terraform), NOT role: on the endpoints-only VPC
  # Karpenter can't reach IAM to manage a profile itself. See iam.tf.
  instanceProfile: {{ .Values.nodeInstanceProfile | quote }}
  subnetSelectorTerms:
    - tags:
        karpenter.sh/discovery: {{ .Values.discoveryTag | quote }}
  securityGroupSelectorTerms:
    - tags:
        karpenter.sh/discovery: {{ .Values.discoveryTag | quote }}
  blockDeviceMappings:
    - deviceName: {{ .Values.blockDevice.deviceName }}
      ebs:
        volumeSize: {{ .Values.blockDevice.volumeSizeGi }}Gi
        volumeType: {{ .Values.blockDevice.volumeType }}
        encrypted: true
{{- include "karpenter.gpuEbsTuning" . }}
  # Hop limit 1: a pod is one hop beyond the host, so an IMDS response (TTL=1) expires
  # before reaching it — pods cannot read IMDS or assume the node role via SSRF.
  # Workloads get AWS creds from EKS Pod Identity, not IMDS. See test_imds_blocked.
  metadataOptions:
    httpEndpoint: enabled
    httpTokens: required
    httpPutResponseHopLimit: 1
{{ include "karpenter.gpuParallelPullUserData" . }}
  tags:
    karpenter.sh/discovery: {{ .Values.discoveryTag | quote }}
