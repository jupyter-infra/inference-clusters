# Path-B onboard fixture for the `builds:` capability: a bare KRO graph whose ONE
# container image has NO published upstream to import — it is BUILT from the build
# context shipped alongside (build-ctx/Dockerfile) via the cluster's image-build job.
#
# The image field below is a LITERAL placeholder; the onboarder OVERWRITES it (it never
# reads it) with the built <ecr>/workload/<name>@<digest>. values.yaml declares the
# builds: entry that drives the build + rewrite.
apiVersion: kro.run/v1alpha1
kind: ResourceGraphDefinition
metadata:
  name: imgbuild-graph
spec:
  schema:
    apiVersion: v1alpha1
    kind: ImgbuildGraph
    spec:
      replicas: integer | default=1
    status:
      availableReplicas: ${deployment.status.availableReplicas}
  resources:
    - id: deployment
      template:
        apiVersion: apps/v1
        kind: Deployment
        metadata:
          name: ${schema.metadata.name}
        spec:
          replicas: ${schema.spec.replicas}
          selector:
            matchLabels:
              app: ${schema.metadata.name}
          template:
            metadata:
              labels:
                app: ${schema.metadata.name}
            spec:
              containers:
                - name: app
                  # LITERAL placeholder — no upstream exists; the onboarder BUILDS this
                  # from build-ctx/ (values.yaml builds:) and rewrites it to our ECR @digest.
                  image: imgbuild-graph-app:v1
