{{- /*
PodMonitors for the gateway's routing metrics, so the in-cluster kube-prometheus-stack
Prometheus scrapes them (the add-on's own OTel path targets AMP, which this template
does not provision). The `release` label is what that Prometheus selects on.

  - EPP (one Deployment per scheduler, in THIS namespace): per-model request count /
    latency / token counters and InferencePool aggregates (ready pods, avg KV-cache, queue).
  - BBR (shared, in the add-on namespace): model-name extraction success/failure.
*/ -}}
{{- if .Values.scrape.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: {{ .Values.gatewayName }}-epp
  namespace: {{ .Release.Namespace }}
  labels:
    {{- toYaml .Values.serviceMonitorLabel | nindent 4 }}
spec:
  namespaceSelector:
    matchNames:
      - {{ .Release.Namespace }}
  selector:
    {{- toYaml .Values.scrape.epp.selector | nindent 4 }}
  podMetricsEndpoints:
    - port: {{ .Values.scrape.epp.port }}
      path: /metrics
      interval: {{ .Values.scrape.interval }}
      bearerTokenSecret:
        name: {{ .Values.gatewayName }}-metrics-reader
        key: token
---
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: {{ .Values.gatewayName }}-bbr
  namespace: {{ .Release.Namespace }}
  labels:
    {{- toYaml .Values.serviceMonitorLabel | nindent 4 }}
spec:
  namespaceSelector:
    matchNames:
      - {{ .Values.gatewayNamespace }}
  selector:
    {{- toYaml .Values.scrape.bbr.selector | nindent 4 }}
  podMetricsEndpoints:
    - port: {{ .Values.scrape.bbr.port }}
      path: /metrics
      interval: {{ .Values.scrape.interval }}
---
{{- /*
Long-lived token for a dedicated metrics-reader identity, bound only to the
non-resource URL /metrics (what the EPP's SubjectAccessReview checks).
*/}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.gatewayName }}-metrics-reader
  namespace: {{ .Release.Namespace }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.gatewayName }}-metrics-reader
  namespace: {{ .Release.Namespace }}
  annotations:
    kubernetes.io/service-account.name: {{ .Values.gatewayName }}-metrics-reader
type: kubernetes.io/service-account-token
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ .Release.Namespace }}-{{ .Values.gatewayName }}-metrics-reader
rules:
  - nonResourceURLs: ["/metrics"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ .Release.Namespace }}-{{ .Values.gatewayName }}-metrics-reader
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ .Release.Namespace }}-{{ .Values.gatewayName }}-metrics-reader
subjects:
  - kind: ServiceAccount
    name: {{ .Values.gatewayName }}-metrics-reader
    namespace: {{ .Release.Namespace }}
{{- end }}
