schema_version: 2

required:
  # fill in values below, or run 'jd config' for the interactive experience

overrides:
  # uncomment and change a value to override the default
  # region: us-west-2
  # cluster_name_prefix: inference
  # kubernetes_version: "1.33"
  # karpenter_version: "1.6.0"
  # custom_tags: {}
  #
  # --- Multi-Node Platform (opt-in) ---
  # Set enable flags to true to deploy multi-node inference modules.
  # enable_lws: true
  # enable_kro: true
  # enable_kueue: true
  # enable_multinode_nodepool: true
  # enable_nvidia_plugin: true
  # enable_efa_plugin: true
  # enable_efs_csi: true
  #
  # --- Multi-Node Configuration (only relevant when enabled) ---
  # lws_version: "0.6.2"
  # kro_version: "0.2.1"
  # kueue_version: "0.10.0"
  # kueue_cluster_queue_name: "inference-gpu"
  # kueue_cohort_name: "gpu-cohort"
  # kueue_gpu_quota: 64
  # kueue_gpu_lending_limit: 0
  # kueue_cpu_quota: 768
  # kueue_memory_quota: "4Ti"
  # kueue_workload_namespace: "inference"
  # multinode_instance_families: ["p5", "p4d"]
  # multinode_capacity_types: ["on-demand"]
  # multinode_gpu_limit: 64
  # multinode_consolidate_after: "60s"
  # multinode_root_volume_size: "500Gi"
  # nvidia_plugin_version: "0.17.0"
  # enable_nfd: true
  # efa_plugin_version: "0.5.7"
  # efs_csi_version: "3.1.1"
  # efs_csi_role_arn: ""
  # efs_filesystem_id: ""
  # model_weights_storage_size: "2Ti"
