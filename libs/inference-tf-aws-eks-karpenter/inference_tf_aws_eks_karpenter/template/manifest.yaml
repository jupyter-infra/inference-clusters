schema_version: 1
template:
  name: tf-aws-eks-karpenter
  engine: terraform
  version: 0.1.0rc1
requirements:
- name: terraform
- name: awscli
- name: kubectl
- name: helm
# jd health: aggregate deployment-stack health. The cluster/components/images layers
# apply; the connection + load-balancer layers self-skip (this is an endpoints-only VPC
# with no public ingress/ELB — an end-to-end URL check is meaningless, so no open_url and
# no cluster.loadbalancer.health command is intentional, not a gap).
health:
  active: true
values:
- name: deployment_id
  source: output
  source-key: deployment_id
- name: aws_region
  source: output
  source-key: region
- name: cluster_name
  source: output
  source-key: cluster_name
- name: cluster_endpoint
  source: output
  source-key: cluster_endpoint
- name: cluster_ca_certificate
  source: output
  source-key: cluster_ca_certificate
- name: kubeconfig_path
  source: output
  source-key: kubeconfig_path
project-store:
  store-type: s3-only
commands:
- cmd: cluster.login
  sequence:
  - api-name: aws.eks.update-kubeconfig
    arguments:
    - api-attribute: cluster_name
      source: output
      source-key: cluster_name
  results:
  - result-name: cluster.login.output
    source: result
    source-key: '[0].Output'
- cmd: cluster.status
  sequence:
  - api-name: aws.eks.describe-cluster
    arguments:
    - api-attribute: cluster_name
      source: output
      source-key: cluster_name
  results:
  - result-name: cluster.status
    source: result
    source-key: '[0].Status'
- cmd: cluster.show
  sequence:
  - api-name: aws.eks.describe-cluster
    arguments:
    - api-attribute: cluster_name
      source: output
      source-key: cluster_name
  results:
  - result-name: cluster.show.name
    source: result
    source-key: '[0].ClusterName'
  - result-name: cluster.show.label
    source: result
    source-key: '[0].Label'
  - result-name: cluster.show.status
    source: result
    source-key: '[0].Status'
  - result-name: cluster.show.endpoint
    source: result
    source-key: '[0].Endpoint'
  - result-name: cluster.show.version
    source: result
    source-key: '[0].Version'
- cmd: host.list
  sequence:
  - api-name: k8s.core.list-nodes
    arguments:
    - api-attribute: query
      source: cli
      source-key: query
    - api-attribute: page_size
      source: cli
      source-key: limit
    - api-attribute: pagination_token
      source: cli
      source-key: continue_from
  results:
  - result-name: host.list
    source: result
    source-key: '[0].NodeNames'
  - result-name: host.list.next_token
    source: result
    source-key: '[0].NextToken'
- cmd: host.status
  sequence:
  - api-name: k8s.core.get-node
    arguments:
    - api-attribute: name
      source: cli
      source-key: name
  results:
  - result-name: host.status
    source: result
    source-key: '[0].Status'
- cmd: host.show
  sequence:
  - api-name: k8s.core.get-node
    arguments:
    - api-attribute: name
      source: cli
      source-key: name
  results:
  - result-name: host.show.name
    source: result
    source-key: '[0].Name'
  - result-name: host.show.status
    source: result
    source-key: '[0].Status'
  - result-name: host.show.resource
    source: result
    source-key: '[0].Resource'
# --- jd health: component + image status ---
# The components: block spans four component types, each bound BY ITS `type:` string to the
# matching `component.<type>.status` command below (jd derives the cmd name from the type):
#   Deployment  -> Karpenter, KEDA x3, prometheus-operator, Grafana, kube-state-metrics, KRO
#   DaemonSet   -> node-exporter (every node), DCGM + device-plugin (GPU nodes only)
#   StatefulSet -> Prometheus server, Alertmanager
#   HelmRelease -> DCGM + device-plugin charts (pod-count-agnostic — see note below)
- cmd: component.deployment.status
  sequence:
  - api-name: k8s.apps.get-deployment-status
    arguments:
    - api-attribute: name
      source: cli
      source-key: name
    - api-attribute: scope
      source: cli
      source-key: scope
  results:
  - result-name: component.deployment.status.status
    source: result
    source-key: '[0].Status'
  - result-name: component.deployment.status.status_category
    source: result
    source-key: '[0].StatusCategory'
  - result-name: component.deployment.status.details
    source: result
    source-key: '[0].Details'
  - result-name: component.deployment.status.sub_component
    source: result
    source-key: '[0].SubComponent'
- cmd: component.daemonset.status
  sequence:
  - api-name: k8s.apps.get-daemonset-status
    arguments:
    - api-attribute: name
      source: cli
      source-key: name
    - api-attribute: scope
      source: cli
      source-key: scope
  results:
  - result-name: component.daemonset.status.status
    source: result
    source-key: '[0].Status'
  - result-name: component.daemonset.status.status_category
    source: result
    source-key: '[0].StatusCategory'
  - result-name: component.daemonset.status.details
    source: result
    source-key: '[0].Details'
  - result-name: component.daemonset.status.sub_component
    source: result
    source-key: '[0].SubComponent'
- cmd: component.statefulset.status
  sequence:
  - api-name: k8s.apps.get-statefulset-status
    arguments:
    - api-attribute: name
      source: cli
      source-key: name
    - api-attribute: scope
      source: cli
      source-key: scope
  results:
  - result-name: component.statefulset.status.status
    source: result
    source-key: '[0].Status'
  - result-name: component.statefulset.status.status_category
    source: result
    source-key: '[0].StatusCategory'
  - result-name: component.statefulset.status.details
    source: result
    source-key: '[0].Details'
  - result-name: component.statefulset.status.sub_component
    source: result
    source-key: '[0].SubComponent'
- cmd: component.helmrelease.status
  sequence:
  - api-name: helm.status
    arguments:
    - api-attribute: name
      source: cli
      source-key: name
    - api-attribute: scope
      source: cli
      source-key: scope
    - api-attribute: expected_cluster_config
      source: output
      source-key: cluster_arn
  results:
  - result-name: component.helmrelease.status.status
    source: result
    source-key: '[0].Status'
  - result-name: component.helmrelease.status.status_category
    source: result
    source-key: '[0].StatusCategory'
  - result-name: component.helmrelease.status.details
    source: result
    source-key: '[0].Details'
  - result-name: component.helmrelease.status.sub_component
    source: result
    source-key: '[0].SubComponent'
# --- jd health: component `show` (full resource JSON, `kubectl describe`-equivalent) ---
# Backs `jd component show` for every component type.
- cmd: component.deployment.show
  sequence:
  - api-name: k8s.apps.get-deployment
    arguments:
    - api-attribute: name
      source: cli
      source-key: name
    - api-attribute: scope
      source: cli
      source-key: scope
  results:
  - result-name: component.deployment.show.name
    source: result
    source-key: '[0].Name'
  - result-name: component.deployment.show.resource
    source: result
    source-key: '[0].Resource'
- cmd: component.daemonset.show
  sequence:
  - api-name: k8s.apps.get-daemonset
    arguments:
    - api-attribute: name
      source: cli
      source-key: name
    - api-attribute: scope
      source: cli
      source-key: scope
  results:
  - result-name: component.daemonset.show.name
    source: result
    source-key: '[0].Name'
  - result-name: component.daemonset.show.resource
    source: result
    source-key: '[0].Resource'
- cmd: component.statefulset.show
  sequence:
  - api-name: k8s.apps.get-statefulset
    arguments:
    - api-attribute: name
      source: cli
      source-key: name
    - api-attribute: scope
      source: cli
      source-key: scope
  results:
  - result-name: component.statefulset.show.name
    source: result
    source-key: '[0].Name'
  - result-name: component.statefulset.show.resource
    source: result
    source-key: '[0].Resource'
- cmd: component.helmrelease.show
  sequence:
  - api-name: helm.show
    arguments:
    - api-attribute: name
      source: cli
      source-key: name
    - api-attribute: scope
      source: cli
      source-key: scope
    - api-attribute: expected_cluster_config
      source: output
      source-key: cluster_arn
  results:
  - result-name: component.helmrelease.show.name
    source: result
    source-key: '[0].Name'
  - result-name: component.helmrelease.show.resource
    source: result
    source-key: '[0].Resource'
# --- jd health: Deployment `logs` + `restart` ---
# logs backs `jd component logs` (Deployment-backed only); anything after `--` passes
# through to `kubectl logs`. expected_cluster_config guards against the wrong kubeconfig.
- cmd: component.deployment.logs
  sequence:
  - api-name: k8s.core.deployment-logs
    arguments:
    - api-attribute: name
      source: cli
      source-key: name
    - api-attribute: scope
      source: cli
      source-key: scope
    - api-attribute: extra
      source: cli
      source-key: extra
    - api-attribute: expected_cluster_config
      source: output
      source-key: cluster_arn
  results:
  - result-name: component.deployment.logs.logs
    source: result
    source-key: '[0].Logs'
# restart backs `jd component restart` (rolling restart; Deployment-backed only).
- cmd: component.deployment.restart
  sequence:
  - api-name: k8s.apps.rollout-restart
    arguments:
    - api-attribute: name
      source: cli
      source-key: name
    - api-attribute: scope
      source: cli
      source-key: scope
# reconcile backs `jd component reconcile` — re-applies a HelmRelease's stored manifest to
# recreate objects deleted out-of-band (a plain `helm upgrade` only acts on the release
# diff, so it never recreates them). Requires a helm client on the host.
- cmd: component.helmrelease.reconcile
  sequence:
  - api-name: helm.reconcile
    arguments:
    - api-attribute: name
      source: cli
      source-key: name
    - api-attribute: scope
      source: cli
      source-key: scope
    - api-attribute: expected_cluster_config
      source: output
      source-key: cluster_arn
  results:
  - result-name: component.helmrelease.reconcile.output
    source: result
    source-key: '[0].Output'
# Image status backs the images: block — confirms each vendored platform image landed in
# our ECR (the air-gapped failure mode this VPC is prone to). The image handler calls
# image.tags first (to pick the latest tag to probe), so both commands are required.
- cmd: image.tags
  sequence:
  - api-name: aws.ecr.list-image-tags
    arguments:
    - api-attribute: repository_name
      source: cli
      source-key: repository_name
  results:
  - result-name: image.tags.tags
    source: result
    source-key: '[0].Tags'
- cmd: image.status
  sequence:
  - api-name: aws.ecr.describe-image
    arguments:
    - api-attribute: repository_name
      source: cli
      source-key: repository_name
    - api-attribute: image_tag
      source: cli
      source-key: image_tag
  results:
  - result-name: image.status.status
    source: result
    source-key: '[0].Status'
  - result-name: image.status.status_category
    source: result
    source-key: '[0].StatusCategory'
# image.show backs `jd image show` — the repo URI + the scanner backing vuln reporting.
- cmd: image.show
  sequence:
  - api-name: aws.ecr.describe-repository
    arguments:
    - api-attribute: repository_name
      source: cli
      source-key: repository_name
  - api-name: aws.inspector2.get-scan-status
    arguments:
    - api-attribute: repository_name
      source: cli
      source-key: repository_name
    - api-attribute: image_tag
      source: cli
      source-key: image_tag
  results:
  - result-name: image.show.repository_uri
    source: result
    source-key: '[0].RepositoryUri'
  - result-name: image.show.scanner_type
    source: result
    source-key: '[1].ScannerType'
  - result-name: image.show.last_scanned
    source: result
    source-key: '[1].LastScanned'
  - result-name: image.show.scan_status
    source: result
    source-key: '[1].ScanStatus'
# CVE summary for the images layer's sub-component (informational — the health status is
# ECR-presence only; this adds critical/high counts). Requires AWS Inspector2 enhanced ECR
# scanning enabled on the account; when it isn't, the sub-component shows "scan n/a".
- cmd: image.vulnerabilities
  sequence:
  - api-name: aws.inspector2.list-vulnerabilities
    arguments:
    - api-attribute: repository_name
      source: cli
      source-key: repository_name
    - api-attribute: image_tag
      source: cli
      source-key: image_tag
  results:
  - result-name: image.vulnerabilities.vulnerabilities
    source: result
    source-key: '[0].Vulnerabilities'
  - result-name: image.vulnerabilities.last_scanned
    source: result
    source-key: '[0].LastScanned'
  - result-name: image.vulnerabilities.critical_count
    source: result
    source-key: '[0].CriticalCount'
  - result-name: image.vulnerabilities.high_count
    source: result
    source-key: '[0].HighCount'
  - result-name: image.vulnerabilities.scanner_type
    source: result
    source-key: '[0].ScannerType'
# --- jd health: platform components ---
# `scope` resolves to a namespace output; the component key is the human label;
# `resource-name` is the actual cluster object name when it differs from the key. Each
# component's `type:` selects the backing status command (see the cmd blocks above).
#
# GPU-only DaemonSets (DCGM, device-plugin) are declared BOTH ways on purpose:
#   - as a DaemonSet component  -> exact pod-per-GPU-node readiness (Degraded on a GPU-less
#     cluster, since desired=0 — a known false-alarm, see AGENT.md);
#   - as a HelmRelease component -> chart install state, which stays healthy regardless of
#     whether any GPU node is currently up.
components:
  karpenter:
    type: Deployment
    description: Node autoscaler (provisions GPU/CPU nodes on pending pods)
    scope: karpenter_namespace
    verbs:
      status:
        method: k8s.apps.get-deployment-status
      show:
        method: k8s.apps.get-deployment
      logs:
        method: k8s.core.deployment-logs
      restart:
        method: k8s.apps.rollout-restart
  keda-operator:
    type: Deployment
    description: Pod autoscaler (scales workloads on metrics/queue depth)
    resource-name: keda-operator
    scope: keda_namespace
    verbs:
      status:
        method: k8s.apps.get-deployment-status
      show:
        method: k8s.apps.get-deployment
      logs:
        method: k8s.core.deployment-logs
      restart:
        method: k8s.apps.rollout-restart
  keda-metrics-apiserver:
    type: Deployment
    description: KEDA external-metrics API server
    resource-name: keda-operator-metrics-apiserver
    scope: keda_namespace
    verbs:
      status:
        method: k8s.apps.get-deployment-status
      show:
        method: k8s.apps.get-deployment
      logs:
        method: k8s.core.deployment-logs
      restart:
        method: k8s.apps.rollout-restart
  keda-admission-webhooks:
    type: Deployment
    description: KEDA admission webhooks
    resource-name: keda-admission-webhooks
    scope: keda_namespace
    verbs:
      status:
        method: k8s.apps.get-deployment-status
      show:
        method: k8s.apps.get-deployment
      logs:
        method: k8s.core.deployment-logs
      restart:
        method: k8s.apps.rollout-restart
  prometheus-operator:
    type: Deployment
    description: Prometheus/monitoring stack operator
    resource-name: kube-prometheus-stack-operator
    scope: monitoring_namespace
    verbs:
      status:
        method: k8s.apps.get-deployment-status
      show:
        method: k8s.apps.get-deployment
      logs:
        method: k8s.core.deployment-logs
      restart:
        method: k8s.apps.rollout-restart
  grafana:
    type: Deployment
    description: Metrics dashboards
    resource-name: kube-prometheus-stack-grafana
    scope: monitoring_namespace
    verbs:
      status:
        method: k8s.apps.get-deployment-status
      show:
        method: k8s.apps.get-deployment
      logs:
        method: k8s.core.deployment-logs
      restart:
        method: k8s.apps.rollout-restart
  kube-state-metrics:
    type: Deployment
    description: Kubernetes object metrics exporter
    resource-name: kube-prometheus-stack-kube-state-metrics
    scope: monitoring_namespace
    verbs:
      status:
        method: k8s.apps.get-deployment-status
      show:
        method: k8s.apps.get-deployment
      logs:
        method: k8s.core.deployment-logs
      restart:
        method: k8s.apps.rollout-restart
  kro:
    type: Deployment
    description: Kube Resource Orchestrator (expands workload CRs)
    scope: kro_namespace
    verbs:
      status:
        method: k8s.apps.get-deployment-status
      show:
        method: k8s.apps.get-deployment
      logs:
        method: k8s.core.deployment-logs
      restart:
        method: k8s.apps.rollout-restart
  prometheus:
    type: StatefulSet
    description: Prometheus time-series server
    resource-name: prometheus-kube-prometheus-stack-prometheus
    scope: monitoring_namespace
    verbs:
      status:
        method: k8s.apps.get-statefulset-status
      show:
        method: k8s.apps.get-statefulset
  alertmanager:
    type: StatefulSet
    description: Alertmanager (alert routing/dedup)
    resource-name: alertmanager-kube-prometheus-stack-alertmanager
    scope: monitoring_namespace
    verbs:
      status:
        method: k8s.apps.get-statefulset-status
      show:
        method: k8s.apps.get-statefulset
  # DaemonSets. node-exporter runs on every node (Ready everywhere); the two GPU-only ones
  # report Degraded on a GPU-less cluster (desired=0) — their HelmRelease twins below carry
  # the authoritative install-state signal there.
  node-exporter:
    type: DaemonSet
    description: Per-node hardware/OS metrics exporter
    resource-name: kube-prometheus-stack-prometheus-node-exporter
    scope: monitoring_namespace
    verbs:
      status:
        method: k8s.apps.get-daemonset-status
      show:
        method: k8s.apps.get-daemonset
  dcgm-exporter:
    type: DaemonSet
    description: NVIDIA DCGM GPU-metrics exporter (GPU nodes only)
    resource-name: dcgm-exporter
    scope: monitoring_namespace
    verbs:
      status:
        method: k8s.apps.get-daemonset-status
      show:
        method: k8s.apps.get-daemonset
  nvidia-device-plugin:
    type: DaemonSet
    description: NVIDIA device plugin — advertises GPUs as schedulable (GPU nodes only)
    resource-name: nvidia-device-plugin
    scope: kube_system_namespace
    verbs:
      status:
        method: k8s.apps.get-daemonset-status
      show:
        method: k8s.apps.get-daemonset
  # HelmRelease twins for the GPU-only charts: chart install-state is pod-count-agnostic, so
  # these stay healthy on a GPU-less cluster where the DaemonSet rows above read Degraded.
  dcgm-exporter-chart:
    type: HelmRelease
    description: DCGM exporter Helm chart (GPU metrics)
    resource-name: dcgm-exporter
    scope: monitoring_namespace
    verbs:
      status:
        method: helm.status
      show:
        method: helm.show
      reconcile:
        method: helm.reconcile
  nvidia-device-plugin-chart:
    type: HelmRelease
    description: NVIDIA device-plugin Helm chart
    resource-name: nvidia-device-plugin
    scope: kube_system_namespace
    verbs:
      status:
        method: helm.status
      show:
        method: helm.show
      reconcile:
        method: helm.reconcile
# --- jd health: vendored platform images ---
# Confirms each image the template vendors to ECR (the air-gapped failure mode) is present.
# Workload/* images (chart-onboarded at runtime) are excluded — not known at template time.
images:
  keda-operator:
    description: KEDA operator image
    repository-output: keda_operator_ecr_repository
    tag-output: vendored_image_tag
  keda-metrics-apiserver:
    description: KEDA metrics-apiserver image
    repository-output: keda_metrics_apiserver_ecr_repository
    tag-output: vendored_image_tag
  keda-admission-webhooks:
    description: KEDA admission-webhooks image
    repository-output: keda_admission_webhooks_ecr_repository
    tag-output: vendored_image_tag
  grafana:
    description: Grafana image
    repository-output: grafana_ecr_repository
    tag-output: vendored_image_tag
  dcgm-exporter:
    description: NVIDIA DCGM GPU-metrics exporter image
    repository-output: dcgm_exporter_ecr_repository
    tag-output: vendored_image_tag
  device-plugin:
    description: NVIDIA k8s device-plugin image
    repository-output: device_plugin_ecr_repository
    tag-output: vendored_image_tag
supervised-execution:
  config:
    config.terraform-plan:
      default-phase:
        label: Reading data sources
        progress-pattern: (Read complete after|Refreshing state)
        progress-events-estimate: 120
  up:
    up.terraform-apply:
      phases:
      - enter-pattern: '(module\.vpc|module\.cluster_role|module\.node_role)'
        exit-pattern: 'module\.vpc.*Creation complete'
        label: Creating VPC
        weight: 10
        progress-pattern: '(Creation complete|Still creating)'
        progress-events-estimate: 20
      - enter-pattern: 'module\.eks_cluster\.aws_eks_cluster'
        exit-pattern: 'module\.eks_cluster\.aws_eks_cluster.*Creation complete'
        label: Creating EKS cluster
        weight: 55
        progress-pattern: '(Creation complete|Still creating)'
        progress-events-estimate: 60
      - enter-pattern: '(aws_eks_addon|aws_eks_access_entry|time_sleep|module\.node_group)'
        exit-pattern: 'module\.node_group.*Creation complete'
        label: Provisioning nodes and add-ons
        weight: 25
        progress-pattern: '(Creation complete|Still creating)'
        progress-events-estimate: 40
      - enter-pattern: '(helm_release|module\.image_vendor|null_resource\.image_vendor)'
        exit-pattern: 'helm_release\.kro_starters.*Creation complete'
        label: Deploying platform (autoscaling, storage, observability)
        weight: 15
        progress-pattern: '(Creation complete|Still creating)'
        progress-events-estimate: 25
